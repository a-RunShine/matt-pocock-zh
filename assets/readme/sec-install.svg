<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="ti di">
  <title id="ti">安装三步</title>
  <desc id="di">第一步克隆仓库，第二步把 skill 目录拷进 skills 目录，第三步先试 ask-matt。</desc>

  <defs>
    <pattern id="gridi" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E6EADF" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="#F8F9F3"/>
  <rect width="1200" height="400" fill="url(#gridi)"/>

  <path d="M64 100 H1136" fill="none" stroke="#C9CFC0" stroke-width="2" stroke-dasharray="8 12"/>

  <g font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', -apple-system, 'Segoe UI', sans-serif">
    <rect x="64" y="72" width="56" height="56" fill="#FFE45C"/>
    <text x="92" y="110" text-anchor="middle" font-size="24" font-weight="700" fill="#14161A">01</text>
    <text x="64" y="196" font-size="28" font-weight="700" fill="#14161A">克隆仓库</text>
    <text x="64" y="234" font-size="22" fill="#4A4F48">把仓库拉到本地</text>

    <rect x="432" y="72" width="56" height="56" fill="#FFE45C"/>
    <text x="460" y="110" text-anchor="middle" font-size="24" font-weight="700" fill="#14161A">02</text>
    <text x="432" y="196" font-size="28" font-weight="700" fill="#14161A">拷进 skills 目录</text>
    <text x="432" y="234" font-size="22" fill="#4A4F48">整个目录复制过去</text>

    <rect x="800" y="72" width="56" height="56" fill="#FFE45C"/>
    <text x="828" y="110" text-anchor="middle" font-size="24" font-weight="700" fill="#14161A">03</text>
    <text x="800" y="196" font-size="28" font-weight="700" fill="#14161A">先试 ask-matt</text>
    <text x="800" y="234" font-size="22" fill="#4A4F48">不知道用哪个就问它</text>
  </g>

  <path d="M56 336 q 36 -14 72 0 t 72 0 t 72 0 t 72 0 t 72 0 t 72 0 t 72 0 t 72 0 t 72 0 t 72 0 t 72 0 t 72 0 t 72 0 t 72 0 t 72 0" fill="none" stroke="#DADFCF" stroke-width="2"/>
</svg>
